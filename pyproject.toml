[project]
name = "GeoclimaProject"
version = "0.3.0"
description = "Desktop app that collects daily INMET weather station data and exports it to CSV/Excel."
authors = [
    {name = "PaulitoRenatito",email = "paulorenatosouza02@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11, <3.15"
dependencies = [
    "pandas (>=2.3.1,<3.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "keyring (>=25.7.0,<26.0.0)",
    "pyside6-essentials (>=6.12.0,<7.0.0)",
    "pyqtgraph (>=0.14.0,<0.15.0)"
]

[project.scripts]
geoclima = "geoclima.__main__:main"

[tool.poetry]
packages = [{ include = "geoclima", from = "src" }]

[tool.poetry.group.dev.dependencies]
pyinstaller = ">=6.15.0,<7.0.0"
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
responses = "^0.26.3"
ruff = "^0.17.3"
mypy = "^2.4.1"
pandas-stubs = "^3.1.0.261029"
types-requests = "^2.33.0.20261030"
types-openpyxl = "^3.1.5.20261017"
pytest-timeout = "^2.4.0"
pytest-qt = "^4.5.0"



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["geoclima"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pyqtgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=geoclima --cov-report=term-missing"
# A modal dialog waiting for input would otherwise hang CI for hours; fail with a traceback instead.
timeout = 60
